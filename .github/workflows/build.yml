# Builds DSiRPC's downloads:
#   nds-bootstrap-dsirpc.nds      - our modified nds-bootstrap (nds-bootstrap/)
#   dsirpc-launcher.nds           - the DSi-mode launcher (launcher/)
#   DSiRPC-<version>-windows.zip  - the Windows download: DSiRPC with its own
#                                   Python, both .nds files in an "SD card"
#                                   folder, and README.txt
#                                   (packaging/build_release.py)
#   DSiRPC-<version>-macos.zip    - the macOS download: DSiRPC.app (a menu bar
#                                   app, Apple silicon), the same "SD card"
#                                   folder and README.txt
#                                   (packaging/macos/build_app.py)
#
# - Push to main (when DSiRPC's files change), pull requests, or "Run
#   workflow" on the Actions tab: builds all four and attaches them to the
#   run as artifacts.
# - Push a tag starting with "v" (for example v0.4.0): also publishes a GitHub
#   release with all four.
#
# The .nds files use the same Docker images as the local build commands in
# docs/DEVELOPMENT.md. The Windows and macOS downloads bake in the Discord applications
# in the repository variables DISCORD_CLIENT_ID (Platinum, and every game
# without its own) and DISCORD_DEFAULT_CLIENT_ID (optional: other games), if
# they're set (Settings > Secrets and variables > Actions > Variables).

name: Build DSiRPC

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "nds-bootstrap/**"
      - "launcher/**"
      - "app/**"
      - "core/**"
      - "overlay/**"
      - "rpc/**"
      - "utils/**"
      - "tools/**"
      - "third_party/**"
      - "packaging/**"
      - "Assets/Consoles/**"
      - "Assets/icons/**"
      - "dsirpc.py"
      - "requirements.txt"
      - "Setup.bat"
      - "DSiRPC.bat"
      - ".github/workflows/build.yml"
  pull_request:
    paths:
      - "nds-bootstrap/**"
      - "launcher/**"
      - "app/**"
      - "core/**"
      - "overlay/**"
      - "rpc/**"
      - "utils/**"
      - "tools/**"
      - "third_party/**"
      - "packaging/**"
      - "dsirpc.py"
      - "requirements.txt"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nds-bootstrap:
    name: nds-bootstrap
    runs-on: ubuntu-latest
    steps:
      # Only nds-bootstrap/ is needed, so skip downloading the sprites.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: nds-bootstrap
          filter: blob:none

      # The build needs an "lzss" tool inside the container. A static binary
      # built here runs in there regardless of its library versions.
      - name: Build lzss
        run: gcc -O2 -static nds-bootstrap/lzss.c -o lzss

      - name: Build nds-bootstrap
        run: docker run --rm -v "$GITHUB_WORKSPACE/nds-bootstrap:/build" -v "$GITHUB_WORKSPACE/lzss:/usr/local/bin/lzss:ro" -w /build devkitpro/devkitarm:20241104 make nightly

      # Its license goes along, for the Windows download's licenses folder
      - name: Name the output
        run: |
          cp nds-bootstrap/retail/bin/nds-bootstrap-nightly.nds nds-bootstrap-dsirpc.nds
          cp nds-bootstrap/LICENSE LICENSE-nds-bootstrap.txt

      - uses: actions/upload-artifact@v4
        with:
          name: nds-bootstrap-dsirpc
          path: |
            nds-bootstrap-dsirpc.nds
            LICENSE-nds-bootstrap.txt
          if-no-files-found: error

  # Test builds of nds-bootstrap with one of DSiRPC's pieces switched off, to
  # find what slows a game down on hardware (only for runs started by hand).
  # Never packaged: each has its own file name; rename it to
  # nds-bootstrap-dsirpc.nds on the SD card to try it.
  nds-bootstrap-variants:
    name: nds-bootstrap test build (${{ matrix.name }})
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # (earlier: no-rpcprobe, -DDSIRPC_NO_RPCPROBE; ds-mode-wifi, -DDSIRPC_KEEP_DSI_WIFI=0;
          # no-wifi-side, -DDSIRPC_NO_WIFI; no-checker, -DRPCPROBE_ACH=0 -DDSIRPC_NO_ARM9_HOOK;
          # with the old VBlank hook's work before the game's VBlank handler: arm9-no-clean,
          # arm9-clean-idle, arm9-clean-lines, arm9-delay; after it: writeback-after)
          - name: rom-busy-backoff  # the VBlank tick holds back during ARM9 ROM reads again, as before 2026-10-19
            cflags: -DRPCPROBE_ROM_BUSY_VBLANKS=30
          - name: no-arm9-hook      # no ARM9 half: no write-backs in the game's idle time
            cflags: -DDSIRPC_NO_ARM9_HOOK
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: nds-bootstrap
          filter: blob:none

      - name: Build lzss
        run: gcc -O2 -static nds-bootstrap/lzss.c -o lzss

      - name: Build nds-bootstrap
        run: docker run --rm -e DSIRPC_CFLAGS="${{ matrix.cflags }}" -v "$GITHUB_WORKSPACE/nds-bootstrap:/build" -v "$GITHUB_WORKSPACE/lzss:/usr/local/bin/lzss:ro" -w /build devkitpro/devkitarm:20241104 make nightly

      # How much of each card engine's region is used (ARM7 61 KB, ARM9 0x2FA0
      # bytes in DS mode): the binaries, and where the ARM9 one's .bss ends
      - name: Card engine sizes
        run: |
          ls -l nds-bootstrap/retail/nitrofiles_dec/cardenginei_arm7.bin nds-bootstrap/retail/nitrofiles_dec/cardenginei_arm9.bin || true
          grep -h -E "^ +0x[0-9a-f]+ +(__bss_end|__end__) " nds-bootstrap/retail/cardenginei/arm7/build/*.map nds-bootstrap/retail/cardenginei/arm9/build/*.map || true

      - name: Name the output
        run: cp nds-bootstrap/retail/bin/nds-bootstrap-nightly.nds nds-bootstrap-dsirpc-${{ matrix.name }}.nds

      - uses: actions/upload-artifact@v4
        with:
          name: nds-bootstrap-test-${{ matrix.name }}
          path: nds-bootstrap-dsirpc-${{ matrix.name }}.nds
          if-no-files-found: error

  launcher:
    name: launcher
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: launcher
          filter: blob:none

      - name: Build launcher
        run: docker run --rm -v "$GITHUB_WORKSPACE/launcher:/work" -w /work --entrypoint make skylyrac/blocksds:slim-latest

      - uses: actions/upload-artifact@v4
        with:
          name: dsirpc-launcher
          path: launcher/dsirpc-launcher.nds
          if-no-files-found: error

  windows:
    name: Windows download
    needs: [nds-bootstrap, launcher]
    runs-on: windows-latest
    steps:
      # DSiRPC's own files; of Assets/, only the console pictures (the
      # overlay downloads its sprites when it needs them)
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            app
            core
            overlay
            rpc
            utils
            tools
            third_party
            ra
            packaging
            Assets/Consoles
          filter: blob:none

      - uses: actions/download-artifact@v4
        with:
          path: nds
          merge-multiple: true

      # Only runs pip: the zip gets Python's embeddable package
      # (PYTHON_VERSION in packaging/build_release.py, the same 3.x)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build the zip
        shell: bash
        env:
          DISCORD_CLIENT_ID: ${{ vars.DISCORD_CLIENT_ID }}
          DISCORD_DEFAULT_CLIENT_ID: ${{ vars.DISCORD_DEFAULT_CLIENT_ID }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then version="$GITHUB_REF_NAME"; else version="dev-${GITHUB_SHA::7}"; fi
          python packaging/build_release.py --version "$version" --nds-dir nds --require-nds --check

      - uses: actions/upload-artifact@v4
        with:
          name: DSiRPC-windows
          path: dist/*.zip
          if-no-files-found: error

  macos:
    name: macOS download
    needs: [nds-bootstrap, launcher]
    runs-on: macos-latest   # Apple silicon
    steps:
      # DSiRPC's own files, the console pictures and the app's icon
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            app
            core
            overlay
            rpc
            utils
            third_party
            packaging
            Assets/Consoles
            Assets/icons
          filter: blob:none

      - uses: actions/download-artifact@v4
        with:
          path: nds
          merge-multiple: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # PyInstaller makes DSiRPC.app; build_app.py builds the rcheevos
      # library first and checks the app once it's made
      - name: Build the app
        env:
          DISCORD_CLIENT_ID: ${{ vars.DISCORD_CLIENT_ID }}
          DISCORD_DEFAULT_CLIENT_ID: ${{ vars.DISCORD_DEFAULT_CLIENT_ID }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then version="$GITHUB_REF_NAME"; else version="dev-${GITHUB_SHA::7}"; fi
          python -m pip install --disable-pip-version-check -r requirements.txt pyinstaller certifi
          python packaging/macos/build_app.py --version "$version" --nds-dir nds --require-nds

      - uses: actions/upload-artifact@v4
        with:
          name: DSiRPC-macos
          path: dist/*.zip
          if-no-files-found: error

  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [nds-bootstrap, launcher, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: packaging
          filter: blob:none

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # Creates the release for this tag (install steps first, then notes
      # generated from the commits), or adds the files to it if a release
      # with this tag already exists (for example one made on the website).
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sed "s/{tag}/$GITHUB_REF_NAME/g" packaging/RELEASE_NOTES.md > notes.md
          gh release create "$GITHUB_REF_NAME" dist/*.zip dist/*.nds --repo "$GITHUB_REPOSITORY" --title "DSiRPC $GITHUB_REF_NAME" --notes-file notes.md --generate-notes || gh release upload "$GITHUB_REF_NAME" dist/*.zip dist/*.nds --repo "$GITHUB_REPOSITORY" --clobber
